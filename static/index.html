<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="thermo-token" content="{{TOKEN}}">
<title>Thermo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23f97316' stroke-width='4'/%3E%3Crect x='14' y='9' width='4' height='11' rx='2' fill='%23f97316'/%3E%3C/svg%3E">
<script>
  // Apply the theme before first paint so there's no flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem('thermo-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/vendor/chart.umd.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
